<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재시험 고사장 조회</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF0F6;
    --surface: #FFFFFF;
    --ink: #12233D;
    --muted: #54657E;
    --line: #C3D0E0;
    --focus: #1F5FD1;
    --hero-bg: #12233D;
    --hero-ink: #FFD25A;
    --hero-sub: #B9C7DB;
    --err: #B3261E;
    --err-bg: #FCEBEA;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0D1626; --surface: #15223A; --ink: #E8EEF7; --muted: #9AABC3;
      --line: #2B3C58; --focus: #7FB0FF; --hero-bg: #FFD25A; --hero-ink: #12233D;
      --hero-sub: #3B4A63; --err: #FF9B94; --err-bg: #3A1D1F;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0D1626; --surface: #15223A; --ink: #E8EEF7; --muted: #9AABC3;
    --line: #2B3C58; --focus: #7FB0FF; --hero-bg: #FFD25A; --hero-ink: #12233D;
    --hero-sub: #3B4A63; --err: #FF9B94; --err-bg: #3A1D1F;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    min-height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 440px; margin: 0 auto; padding: 40px 20px 56px; }
  h1 { font-size: 1.75rem; font-weight: 900; letter-spacing: -0.02em; line-height: 1.2; margin: 0 0 8px; }
  .sub { margin: 0 0 32px; color: var(--muted); font-size: 0.9375rem; }

  label { display: block; font-weight: 700; font-size: 0.9375rem; margin-bottom: 8px; }
  .field {
    width: 100%;
    background: var(--surface);
    color: var(--ink);
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 14px 16px;
    font: 700 2.25rem/1.2 "Noto Sans KR", system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.3em;
    outline: none;
    transition: border-color .15s;
  }
  .field::placeholder { font-size: 1.125rem; font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .field:focus-visible { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 30%, transparent); }
  .hint { min-height: 1.5em; margin: 8px 0 0; font-size: 0.875rem; color: var(--muted); }

  #out { margin-top: 24px; }
  .card { border-radius: 14px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); animation: rise .28s ease-out; }
  .room { background: var(--hero-bg); color: var(--hero-ink); padding: 22px 24px 20px; }
  .room .cap { margin: 0; font-size: 0.875rem; font-weight: 500; color: var(--hero-sub); }
  .room .name { display: flex; align-items: baseline; gap: 10px; margin: 2px 0 0; font-weight: 900; line-height: 1; }
  .room .name .t { font-size: 1.5rem; letter-spacing: -0.01em; }
  .room .name .n { font-size: 6rem; letter-spacing: -0.04em; }
  .room .name .full { font-size: 2.5rem; }
  dl { margin: 0; padding: 4px 24px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 14px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  dt { color: var(--muted); font-size: 0.9375rem; flex: none; }
  dd { margin: 0; font-weight: 700; font-size: 1.125rem; text-align: right; overflow-wrap: anywhere; }

  .err { background: var(--err-bg); color: var(--err); border-radius: 12px; padding: 16px 18px; font-weight: 500; animation: rise .28s ease-out; }
  .err b { font-weight: 700; }

  footer { margin-top: 40px; font-size: 0.8125rem; color: var(--muted); }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card, .err { animation: none; } .field { transition: none; } }
  @media (max-width: 360px) { .room .name .n { font-size: 5rem; } .field { font-size: 1.875rem; } }
</style>
</head>
<body>
<main>
  <h1>재시험 고사장 조회</h1>
  <p class="sub">2026학년도 2학기 중간고사 인공지능 수학 재시험</p>

  <label for="sid">학번</label>
  <input id="sid" class="field" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5"
         autocomplete="off" autofocus placeholder="학번 5자리 입력" aria-describedby="hint">
  <p id="hint" class="hint" aria-live="polite">숫자 5개를 입력하면 바로 결과가 나옵니다.</p>

  <section id="out" aria-live="polite"></section>

  <footer>고사장을 찾을 수 없으면 담당 선생님께 문의하세요.</footer>
</main>

<script>

  const input = document.getElementById('sid');
  const hint = document.getElementById('hint');
  const out = document.getElementById('out');
  const DEFAULT_HINT = '숫자 5개를 입력하면 바로 결과가 나옵니다.';

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function roomMarkup(room) {
    const m = room.match(/^(.*?)(\d+)$/);
    if (!m) return '<p class="name" aria-label="' + esc(room) + '"><span class="full">' + esc(room) + '</span></p>';
    return '<p class="name" aria-label="' + esc(room) + '"><span class="t" aria-hidden="true">' + esc(m[1]) +
           '</span><span class="n" aria-hidden="true">' + esc(m[2]) + '</span></p>';
  }

  function render() {
    const v = input.value;
    if (v.length < 5) {
      out.innerHTML = '';
      hint.textContent = v.length === 0 ? DEFAULT_HINT : (5 - v.length) + '자리 더 입력하세요.';
      return;
    }
    const hit = Object.prototype.hasOwnProperty.call(DATA, v) ? DATA[v] : null;
    if (!hit) {
      hint.textContent = '';
      out.innerHTML = '<div class="err" role="alert"><b>' + esc(v) + '</b>에 해당하는 재시험 대상자가 없습니다. 학번을 다시 확인하세요.</div>';
      return;
    }
    hint.textContent = '조회 완료';
    out.innerHTML =
      '<div class="card">' +
        '<div class="room"><p class="cap">고사장</p>' + roomMarkup(hit[2]) + '</div>' +
        '<dl>' +
          '<div class="row"><dt>개설과목</dt><dd>' + esc(hit[0]) + '</dd></div>' +
          '<div class="row"><dt>성명</dt><dd>' + esc(hit[1]) + '</dd></div>' +
          '<div class="row"><dt>학번</dt><dd>' + esc(v) + '</dd></div>' +
        '</dl>' +
      '</div>';
  }

  input.addEventListener('input', () => {
    const clean = input.value.replace(/\D/g, '').slice(0, 5);
    if (clean !== input.value) input.value = clean;
    render();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); render(); input.blur(); } });
</script>
</body>
</html>
